name: Deploy production to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lingoloop-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
  API_SERVICE: lingoloop-api
  WEB_SERVICE: lingoloop-web

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix backend ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test web and production boundary
        run: npm test

      - name: Test API
        run: npm --prefix backend test

  verify-mobile:
    name: Verify mobile application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Verify Expo package compatibility
        run: npm --prefix mobile run check:deps

      - name: Verify native application config
        run: npm --prefix mobile run check:config

      - name: Verify Android native module autolinking
        run: npm --prefix mobile run check:autolink

      - name: Type-check mobile
        run: npm --prefix mobile run typecheck

      - name: Bundle iOS and Android
        run: npm --prefix mobile run bundle

  deploy:
    name: Deploy API and web
    needs: [verify, verify-mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ steps.web_url.outputs.url }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          request_reason: github-actions:${{ github.repository }}@${{ github.sha }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify deployment targets
        shell: bash
        run: |
          test -n "$GCP_PROJECT_ID"
          test -n "$GCP_REGION"
          test -n "$GCP_BUILD_SERVICE_ACCOUNT"
          gcloud run services describe "$API_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(metadata.name)'
          gcloud run services describe "$WEB_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(metadata.name)'

      # 운영 웹은 새 앱(apps/timotalk)입니다. 웹 빌드는 여기서 만들어 이미지 폴더에 넣습니다 — 공용 번역 사전
      # (app/lib/i18n)이 그 폴더 밖에 있어 Cloud Build 안에서는 빌드할 수 없습니다. 서버는 apps/timotalk/web-server/serve.mjs,
      # 설정은 서비스에 이미 있는 LINGOLOOP_API_URL·PROXY_SHARED_SECRET 를 그대로 씁니다(옛 웹과 같은 이름).
      # API 배포보다 먼저 빌드합니다 — 빌드가 실패하면 아무것도 바꾸지 않고 멈춥니다.
      # 되돌리기: 옛 웹의 마지막 버전으로 트래픽을 돌리고 이 변경을 되돌립니다(apps/timotalk/README.md "교체와 되돌리기").
      - name: Use Node.js 22 for the web build
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/timotalk/package-lock.json

      - name: Build the web app
        shell: bash
        run: |
          npm --prefix apps/timotalk ci
          npm --prefix apps/timotalk run typecheck
          npm --prefix apps/timotalk run export:web
          rm -rf apps/timotalk/web-server/dist
          cp -r apps/timotalk/dist apps/timotalk/web-server/dist

      - name: Deploy API
        shell: bash
        run: |
          gcloud run deploy "$API_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --source=backend \
            --build-service-account="$GCP_BUILD_SERVICE_ACCOUNT" \
            --quiet

      - name: Check API revision
        id: api_url
        shell: bash
        run: |
          API_URL="$(gcloud run services describe "$API_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')"
          test -n "$API_URL"
          curl --fail --show-error --silent \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "$API_URL/healthz/" > /dev/null
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy web
        shell: bash
        run: |
          gcloud run deploy "$WEB_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --source=apps/timotalk/web-server \
            --build-service-account="$GCP_BUILD_SERVICE_ACCOUNT" \
            --quiet

      - name: Check production through the web proxy
        id: web_url
        shell: bash
        run: |
          WEB_URL="$(gcloud run services describe "$WEB_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')"
          test -n "$WEB_URL"
          # 새 앱 화면이 나오는지, 운영에는 검색엔진 차단이 붙지 않았는지(베타 설정이 섞이지 않게) 확인합니다.
          PAGE="$(curl --fail --show-error --silent \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "$WEB_URL/")"
          grep -q '/_expo/static/js/web/' <<< "$PAGE"
          HEADERS="$(curl --fail --show-error --silent --head "$WEB_URL/")"
          if grep -qi '^x-robots-tag:' <<< "$HEADERS"; then
            echo "Production web must not send X-Robots-Tag" >&2
            exit 1
          fi
          HEALTH_JSON="$(curl --fail --show-error --silent \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "$WEB_URL/api/health")"
          HEALTH_JSON="$HEALTH_JSON" node --input-type=module -e '
            const health = JSON.parse(process.env.HEALTH_JSON);
            const valid = health?.data?.status === "ok"
              && health?.data?.storage === "firestore"
              && health?.data?.authentication === "identity-platform"
              && health?.data?.ai?.configured === true
              && health?.data?.ai?.provider === "google-vertex-ai"
              && health?.meta?.mock === false
              && health?.meta?.persistent === true;
            if (!valid) {
              console.error("Unexpected production health response", health);
              process.exit(1);
            }
          '
          echo "url=$WEB_URL" >> "$GITHUB_OUTPUT"
